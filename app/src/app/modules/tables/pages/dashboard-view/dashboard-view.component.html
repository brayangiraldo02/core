<div class="container mx-auto">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-700">Tablas y Catálogos de Muestra</h2>
      <p class="text-slate-500 text-sm">
        Ejemplos funcionales con paginación, filtros, modales y exportación a PDF
      </p>
    </div>

    <div class="flex items-center gap-2">
      <button
        mat-flat-button
        color="primary"
        (click)="downloadCurrentTabPdf()"
        [disabled]="isDownloadingPdf()"
        class="h-11! px-4! rounded-xl! shadow-sm"
      >
        <div class="flex items-center gap-2">
          @if (isDownloadingPdf()) {
            <mat-spinner diameter="18" class="text-white"></mat-spinner>
            <span>Generando...</span>
          } @else {
            <mat-icon>picture_as_pdf</mat-icon>
            <span>Descargar Reporte PDF</span>
          }
        </div>
      </button>
    </div>
  </div>

  <mat-tab-group [(selectedIndex)]="selectedTabIndex">
    <mat-tab label="Vehículos">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-vehicles></app-vehicles>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Clientes">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-owners></app-owners>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Inventario">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-inventory></app-inventory>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Plantilla Extra (PDF)">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-example-tab></app-example-tab>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
