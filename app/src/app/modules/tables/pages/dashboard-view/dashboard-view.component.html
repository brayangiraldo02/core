<div class="container mx-auto">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-700">Tablas y Catálogos de Muestra</h2>
      <p class="text-slate-500 text-sm">
        Ejemplos funcionales con paginación, filtros y modales conectados a la API
      </p>
    </div>

    <div class="flex items-center gap-2">
      <button
        mat-flat-button
        color="primary"
        routerLink="/reportes"
        class="h-10! rounded-xl! shadow-sm"
        matTooltip="Ir al módulo independiente de reportes PDF"
      >
        <div class="flex items-center gap-2">
          <mat-icon>picture_as_pdf</mat-icon>
          <span>Generar Reportes PDF</span>
        </div>
      </button>
    </div>
  </div>

  <mat-tab-group>
    <mat-tab label="Vehículos">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-vehicles></app-vehicles>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Clientes">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-owners></app-owners>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Inventario">
      <ng-template matTabContent>
        <div class="mt-6">
          <app-inventory></app-inventory>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
